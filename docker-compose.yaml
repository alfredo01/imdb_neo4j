services:
  neo4j:
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    #container_name: imdb_neo4j
    image: aelfred/imdb_neo4j:latest
    # Bound to loopback on purpose: the API reaches Neo4j over the
    # movies_network bridge as host `neo4j`, so nothing needs these ports from
    # outside. Reach the browser UI through an SSH tunnel instead:
    #   ssh -L 7474:localhost:7474 -L 7687:localhost:7687 <user>@<vps>
    ports:
      - "127.0.0.1:7474:7474"   # HTTP
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      # From the gitignored .env, never committed. Only consulted when Neo4j
      # initializes an empty data dir — on an existing volume the stored
      # password wins, so rotating means ALTER CURRENT USER SET PASSWORD.
      # The :? guard fails the start loudly rather than silently building
      # "neo4j/" from an unset variable.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_use_neo4j_config=true
      # Raised from 2G for the Cypher projection in compute_centrality.py.
      # `gds.graph.project` is an aggregating function, so the ~8.2M rows it
      # consumes accumulate inside one transaction and are charged to this pool;
      # 2G is close enough to the projection's own footprint that hitting the
      # cap would surface as a MemoryPoolOutOfMemoryError mid-projection rather
      # than as anything obviously about memory.
      - NEO4J_db_memory_transaction_total_max=4G

      # Memory. The box has 23GiB and no swap; this claims 16GiB and leaves the
      # rest to fastapi, the frontend and the OS.
      #
      # The page cache is the setting that matters. The image ships a
      # neo4j.conf setting it to 512MiB — nothing here used to override it, so
      # that is what was running: 512MiB of cache for a store whose 99.7M
      # relationships alone are ~3.4GiB before any properties. Every traversal
      # was a disk read, and anything that walks the relationship store at
      # scale (compute_centrality, compute_embeddings) crawled. As a smell
      # test, 10k Person nodes plus a one-hop `EXISTS { (p)-[]->(:Movie) }`
      # could not finish inside a 30s client timeout.
      #
      # Heap came down from 12G to make room. It was only ever that high
      # because gds.betweenness.write wanted 6.4GiB against a projection of all
      # 16.1M Person and Movie nodes; compute_centrality.py now projects the
      # ~3M that can actually score, which needs about 1GiB.
      #
      # initial == max on purpose: with -XX:+AlwaysPreTouch (set in the image)
      # the JVM commits the whole heap at startup anyway, so a smaller initial
      # size buys nothing and only adds resize pauses.
      #
      # These are the Neo4j 5+ setting names. The old dbms.* spellings still
      # resolve but are deprecated, and mixing the two makes it genuinely hard
      # to tell which one won — check with:
      #   SHOW SETTINGS YIELD name, value, isExplicitlySet
      #   WHERE name STARTS WITH 'server.memory'
      - NEO4J_server_memory_heap_initial__size=8G
      - NEO4J_server_memory_heap_max__size=8G
      - NEO4J_server_memory_pagecache_size=8G

      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_security_procedures_whitelist=gds.*, apoc.*
      - NEO4J_dbms_security_procedures_unrestricted=gds.*, apoc.*
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/plugins:/plugins
      - ./neo4j/raw_data:/var/lib/neo4j/import
    networks:
      - movies_network
    restart:
      always

  #streamlit:
  #  build:
  #    context: ./streamlit  # Point to the streamlit folder
  #    dockerfile: Dockerfile # Ensure it picks up the correct file
  #  container_name: streamlit
  #  depends_on:
  #    - neo4j
  #  ports:
  #    - "8501:8501"
  #  working_dir: /app
  #  image: streamlit:latest
  #  volumes:
  #    - ./streamlit:/app
  #  networks:
  #    - movies_network
  #  #command: streamlit run streamlit_app.py
#
  fastapi:
    #image: python:3.9-slim
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_server
    depends_on:
      - neo4j
    networks:
      - movies_network
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./streamlit:/app/streamlit
      - ./neo4j/raw_data:/app/raw_data:ro
    env_file:
      - .env
    restart: unless-stopped
    #command: >
    #  sh -c "pip install --upgrade -r requirements.txt && uvicorn app.api:api --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context : ./node-frontend
      args:
        - REACT_APP_API_URL=http://207.180.232.247:8000
    environment:
      - REACT_APP_API_URL=http://207.180.232.247:8000
    #volumes:
    #  - ./docker-nodejs-sample-main:/app
    ports:
      - "80:3000"

    depends_on:
      - fastapi
      #- streamlit
    networks:
      - movies_network

volumes:
  neo4j_data:
networks:
  movies_network:
    driver: bridge